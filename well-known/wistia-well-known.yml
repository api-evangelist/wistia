generated: '2026-08-14'
method: probed
source: live HTTPS probes of every apis.yml baseURL host and the docs host
description: >-
  Probe of the RFC-registered /.well-known/ surface across every Wistia host in this
  profile. Wistia serves a real, non-trivial well-known surface: RFC 8414 authorization
  server metadata, RFC 9728 protected resource metadata, and an RFC 9727 api-catalog
  linkset that points at the machine-readable OpenAPI description and the MCP server
  card. The oauth and api-catalog documents are served identically from wistia.com,
  api.wistia.com and fast.wistia.com — the same edge answers all three.
hosts:
- host: api.wistia.com
  probes:
  - path: /.well-known/oauth-authorization-server
    status: 200
    content_type: application/json
    file: wistia-oauth-authorization-server.json
    note: >-
      RFC 8414 metadata. Declares authorization/token/revocation/introspection/registration
      endpoints, authorization_code + refresh_token + client_credentials grants, PKCE S256,
      seven scopes, and a non-standard `agent_auth` block that points at an agent-facing
      auth.md skill document.
  - path: /.well-known/oauth-protected-resource
    status: 200
    content_type: application/json
    file: wistia-oauth-protected-resource.json
    note: RFC 9728 protected resource metadata; resource https://api.wistia.com, bearer header.
  - path: /.well-known/api-catalog
    status: 200
    content_type: application/linkset+json
    file: wistia-api-catalog.json
    note: >-
      RFC 9727 linkset. Anchors https://api.wistia.com/modern to a service-desc OpenAPI at
      https://wistia.github.io/wistia/api/openapi-modern.yaml, service-doc at docs.wistia.com,
      and a status endpoint at https://api.wistia.com/health; a second anchor exposes the MCP
      server card. This is how the machine-readable contract was discovered.
  - path: /.well-known/mcp/server-card.json
    status: 200
    content_type: application/json
    file: wistia-mcp-server-card.json
    note: >-
      Not probed blind — referenced by the api-catalog linkset. Declares the wistia-api-mcp
      server, streamable-http transport at https://api.wistia.com/mcp/api, tools/resources/prompts
      capabilities, and four supported MCP protocol versions.
