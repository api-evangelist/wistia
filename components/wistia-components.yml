description: >-
  Wistia's client-side surface is as large as its REST surface and is a distinct product from the
  Data API: embeddable players, hosted pickers and uploaders, and a plugin framework. The current
  generation, Aurora, is a standards-based custom element — `<wistia-player>` — with a React
  wrapper, replacing the legacy Vulcan player and its E-v1.js loader. Wistia documents a migration
  path between the two generations, which is the right thing to look for when judging whether a
  component library is maintained or merely present.
families:
- name: Aurora Player
  kind: web-component
  status: current
  element: <wistia-player media-id="abc123"></wistia-player>
  packages:
  - '@wistia/wistia-player'
  - '@wistia/wistia-player-react'
  loaders:
  - name: player.js
    url: https://fast.wistia.com/player.js
    pinning: >-
      Optional @<version> suffix (player.js@1.2.3, player.js@latest); the default in-app embed code
      is unpinned and always follows the newest release. Works on both fast.wistia.com (standard)
      and fast.wistia.net (iframe).
  - name: per-media loader
    url: https://fast.wistia.com/embed/{mediaHashedId}.js
    note: Loaded as type="module" alongside player.js in the standard embed code.
  surfaces:
