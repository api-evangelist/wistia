- aid: wistia:webhooks
  name: Wistia Webhooks
  description: >-
    Real-time webhook deliveries from Wistia for documented media lifecycle events. Deliveries are HTTP
    POST with a JSON body and are signed via HMAC-SHA256 using the consumer's configured webhook secret,
    supplied in the X-Wistia-Signature header. See the linked AsyncAPI 2.6 description for the modeled
    events and payload shape.
  humanURL: https://docs.wistia.com/docs/webhooks
  baseURL: https://docs.wistia.com/docs/webhooks
  tags:
