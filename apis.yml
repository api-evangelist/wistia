  name: Wistia Upload API
  description: >-
    Endpoint for uploading video files directly to a Wistia account, typically used in conjunction with
    the Data API to manage uploaded media. Authentication uses the same API access token.
  humanURL: https://docs.wistia.com/reference/upload
  baseURL: https://upload.wistia.com
