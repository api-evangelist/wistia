apis:
- aid: wistia:data-api
  name: Wistia Data API
  description: >-
    REST API providing programmatic access to medias, projects, accounts, customizations, captions, and
    statistics in a Wistia account. Data is returned in JSON over HTTPS. Authentication uses Bearer Tokens
    via the Authorization header or HTTP Basic Auth with the API token as the password. Rate limited to
    600 requests per minute per account.
  humanURL: https://docs.wistia.com/reference/getting-started-with-the-data-api
  baseURL: https://api.wistia.com/v1
  tags:
  - Video
  - Media
  - Analytics
  - Captions
  - Projects
  properties:
  - type: Documentation
    url: https://docs.wistia.com/reference/getting-started-with-the-data-api
  - type: GettingStarted
    url: https://docs.wistia.com/docs/making-api-requests
  - type: Authentication
    url: https://docs.wistia.com/docs/authenticating-with-oauth2
  - type: APIReference
    url: https://docs.wistia.com/reference
- aid: wistia:upload-api
  name: Wistia Upload API
  description: >-
    Endpoint for uploading video files directly to a Wistia account, typically used in conjunction with
    the Data API to manage uploaded media. Authentication uses the same API access token.
  humanURL: https://docs.wistia.com/reference/upload
  baseURL: https://upload.wistia.com
  tags:
  - Video Upload
  - Media Ingest
  properties:
  - type: Documentation
    url: https://docs.wistia.com/reference/upload
- aid: wistia:webhooks
  name: Wistia Webhooks
  description: >-
    Real-time webhook deliveries from Wistia for documented media lifecycle events. Deliveries are HTTP
    POST with a JSON body and are signed via HMAC-SHA256 using the consumer's configured webhook secret,
    supplied in the X-Wistia-Signature header. See the linked AsyncAPI 2.6 description for the modeled
    events and payload shape.
  humanURL: https://docs.wistia.com/docs/webhooks
  baseURL: https://docs.wistia.com/docs/webhooks
  tags:
  - Webhooks
  - Events
  - Media
  - AsyncAPI
  properties:
  - type: Documentation
    url: https://docs.wistia.com/docs/webhooks
  - type: AsyncAPI
    url: >-
      https://raw.githubusercontent.com/api-evangelist/wistia/refs/heads/main/asyncapi/wistia-asyncapi.yml
