- aid: wistia:data-api-modern-edge
  name: Wistia Data API (modern, edge)
  description: >-
    The edge description of Wistia's modern API — 115 paths and 167 operations, the preview of what
    lands in the next dated stable release. It carries surfaces absent from 2026-01: Remix (AI video
    editing), Analytics, Brands, Share Links, Review Bundles, Custom Metadata Fields, Deleted Media,
    Bulk Actions, Push Devices and Extended Audio Descriptions. It is also the document that carries
    Wistia's MCP wiring — 125 operations declare an x-wistia-mcp-tool-name plus MCP behaviour
    annotations, and 23 more are explicitly hidden from agents with x-wistia-mcp-ignore. This is the
    service-desc that https://api.wistia.com/.well-known/api-catalog points at. Treat it as a
    preview, not a contract.
  humanURL: https://docs.wistia.com/reference
  baseURL: https://api.wistia.com/modern
