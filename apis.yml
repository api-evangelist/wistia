- aid: wistia:mcp
  name: Wistia MCP Server
  description: >-
    Wistia's first-party hosted Model Context Protocol server, exposing 125 tools across the media,
    folders, channels, captions, customizations, tags, webinars, sharing, account, analytics, stats
    and remix toolsets. It is a REMOTE streamable-HTTP endpoint an agent POSTs to directly — no
    local install — authenticated with OAuth or a Wistia access token, and currently limited to
    account owners and managers. Discoverable without a human: the server card is linked from
    Wistia's RFC 9727 api-catalog. An anonymous tools/list returns 401, so the tool inventory in
    this profile is read from the provider's own OpenAPI annotations rather than guessed.
  humanURL: https://docs.wistia.com/docs/mcp-server-guide
  baseURL: https://api.wistia.com/mcp/api
  tags:
  - MCP
  - Agents
  - Video
