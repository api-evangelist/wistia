- aid: wistia:data-api
  name: Wistia Data API
  description: >-
    REST API providing programmatic access to medias, projects, accounts, customizations, captions, and
    statistics in a Wistia account. Data is returned in JSON over HTTPS. Authentication uses Bearer Tokens
    via the Authorization header or HTTP Basic Auth with the API token as the password. Rate limited to
    600 requests per minute per account.
  humanURL: https://docs.wistia.com/reference/getting-started-with-the-data-api
