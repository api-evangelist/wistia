aid: wistia
name: Wistia
description: >-
  Wistia is an all-in-one video marketing platform for businesses that
  combines branded video hosting, webinars, video editing, webcam and
  screen recording, and deep viewer analytics for B2B marketing teams
  focused on lead generation, brand control, and content performance.
  Founded in 2006, Wistia is used by more than 425,000 businesses and
  integrates with major marketing automation and CRM platforms. Wistia
  ships an unusually complete developer surface for its category: a
  frozen evergreen Data API at https://api.wistia.com/v1 alongside a
  header-versioned modern API at https://api.wistia.com/modern with dated
  stable releases (2026-01), OpenAPI 3.1 descriptions made discoverable
  through an RFC 9727 api-catalog linkset, OAuth 2.0 with RFC 8414/9728
  discovery and dynamic client registration, a hosted MCP server at
  https://api.wistia.com/mcp/api, a Go CLI, a Speakeasy-generated
  TypeScript SDK, and the Aurora `<wistia-player>` web component.
type: Index
