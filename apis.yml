- aid: wistia:data-api-2026-01
  name: Wistia Data API 2026-01
  description: >-
    The current STABLE release of Wistia's modern Data API — 55 paths and 85 operations covering
    media, folders, subfolders, folder sharings, captions, localizations, trims, customizations,
    tags, taggings, channels, channel episodes, webinars, webinar registrations, search, stats,
    allowed domains, expiring access tokens and background jobs. Version is selected with the
    X-Wistia-Api-Version request header rather than the path; each dated stable release is
    supported for one year from its release date, so 2026-01 is supported until 2027-01. The
    OpenAPI 3.1.1 description is published by Wistia at
    https://wistia.github.io/wistia/api/openapi-2026-01.yaml and is discoverable machine-to-machine
    through the RFC 9727 api-catalog linkset at https://api.wistia.com/.well-known/api-catalog.
