source: https://wistia.com/pricing
description: >-
  Wistia sells the video platform on four published tiers plus a separately-priced Webinars line.
  Pricing is seat- and storage-gated, not API-gated: there is no per-call, per-token or API-tier
  pricing anywhere on the pricing page, and the API is presented as a platform feature ("Wistia
  API — Build custom video experiences for your site") rather than a metered product. The
  practical API gate is feature access — SSO, video playback protection and team accounts sit on
  Enterprise — and the account-wide 600 requests/minute ceiling is the same for everyone.
  Prices below are the monthly-billed figures shown on the page; the page offers "Save 20%" on
  annual billing without publishing the resulting annual figures.
currency: USD
