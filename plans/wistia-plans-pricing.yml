overage:
  note: >-
    The pricing page does not publish an overage rate for storage or bandwidth beyond the included
    allowance; tiers are described as "250 GB+" and "starting at 1 TB", implying negotiated
    expansion rather than a posted per-GB price.
api_pricing:
  metered: false
  api_tier_gated: false
  note: >-
    No API tier, call allowance, or per-request price is published. The Data API, MCP server and CLI
    are available to accounts with an API token; the MCP server is additionally restricted to
    account owners and managers per https://docs.wistia.com/docs/mcp-server-guide.
  usage_endpoint: >-
    GET /account/usage (Get Account Usage) returns plan tier, upload eligibility and limit
    information programmatically; usage and limit details are visible only to account owners and
    managers, other contacts receive null for `limits`.
  usage_endpoint_docs: https://docs.wistia.com/reference/getaccountusage
other_lines:
