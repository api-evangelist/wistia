  (x-wistia-mcp-tool-name, x-wistia-mcp-annotations), https://api.wistia.com/.well-known/oauth-authorization-server,
  and https://docs.wistia.com/docs/making-api-requests
x-description: 'Non-destructive enhancements over the stable 2026-01 description. The single largest gap
  in the published spec is missing operationIds: 84 of 85 operations have none, which makes the contract
  hard to code-generate against and impossible to reference stably. Rather than invent names, this overlay
  lifts Wistia''s OWN MCP tool name for each method+path out of the edge description and camelCases it,
  so the identifiers trace back to the provider. It also fills in contact/terms/license and describes
  the bearer credential.'
