    - BearerAuth: []
- target: $.components.securitySchemes['BearerAuth']
  description: Describe what the bearer credential actually is and where it comes from.
  update:
    description: 'A Wistia API access token created in the API tab of Account Settings (https://account.wistia.com/account/api),
      or an OAuth 2.0 access token issued by https://api.wistia.com. Sent as `Authorization: Bearer <token>`.
      TLS is required. Scopes: see https://api.wistia.com/.well-known/oauth-authorization-server.'
