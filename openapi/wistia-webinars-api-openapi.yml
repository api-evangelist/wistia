              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Webinars are not available on your current plan
        '422':
          description: Validation errors
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                    examples:
                    - - Title is required
                      - Event duration must be at least 15 minutes
        '429':
          description: Rate limit exceeded
          content:
            text/plain:
              schema:
                type: string
                examples:
                - Rate limit exceeded
        '500':
          description: Internal server error during webinar creation
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    description: Error message describing the server-side failure.
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                    examples:
                    - - An error occurred while creating the webinar. Please try again.
      tags:
      - Webinars
      security:
      - BearerAuth: []
      operationId: postWebinars
      x-operation-id-source: derived
