                    description: The hashed ID of the webinar
                    type: string
                    examples:
                    - abc123def456
                  title:
                    description: The title of the webinar
                    type: string
                    examples:
                    - 'Wellness Session: Coping with Outie Memories'
                  description:
                    description: The description of the webinar
                    type:
                    - string
                    - 'null'
                    examples:
                    - A comprehensive session on managing work-life balance
                  scheduled_for:
                    description: The scheduled start time in W3C format with timezone
                    type:
                    - string
                    - 'null'
                    format: date-time
                    examples:
                    - '2024-03-20T15:30:00-05:00'
                  event_duration:
                    description: Duration of the webinar in minutes
                    type:
                    - integer
                    - 'null'
                    examples:
                    - 60
                  time_zone:
                    description: The IANA time zone identifier the webinar is scheduled in
                    type: string
                    examples:
                    - America/New_York
                  lifecycle_status:
                    description: The current lifecycle status of the webinar. This is a read-only, system-managed field that Wistia updates as the event moves through its lifecycle; it cannot be set or changed via the API.
                    type: string
                    readOnly: true
                    enum:
                    - pending
                    - ready
                    - starting
                    - started
                    - ended
                    - vod_ready
                    - failed
                    examples:
                    - ready
                  registration_status:
                    description: Registration status of the event
                    type: string
                    examples:
                    - published
                  created_at:
                    description: When the event was created (UTC)
                    type: string
                    format: date-time
                    examples:
                    - '2024-03-15T10:30:00Z'
                  updated_at:
                    description: When the event was last updated (UTC)
                    type: string
                    format: date-time
                    examples:
                    - '2024-03-15T10:30:00Z'
                  audience_link:
                    description: Link for the audience to join the event
                    type: string
                    examples:
                    - https://lumon-industries.wistia.com/live/events/abc123def456
                  host_link:
                    description: Link for the host to manage the event
                    type: string
                    examples:
                    - https://lumon-industries.wistia.com/live/events/abc123def456/onair
                  panelist_link:
                    description: Link for panelists to join the event
                    type: string
                    examples:
                    - https://lumon-industries.wistia.com/live/events/abc123def456/onair/a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  thumbnail_url:
                    description: URL of the webinar's custom thumbnail image, or null if no custom thumbnail has been set
                    type:
                    - string
                    - 'null'
                    examples:
                    - https://embed-ssl.wistia.com/deliveries/abc123def456.jpg
                  folder:
                    description: The folder (project) this webinar belongs to
                    unevaluatedProperties: false
                    oneOf:
                    - unevaluatedProperties: false
                      type: object
                      properties:
                        id:
                          description: A unique alphanumeric identifier for the record.
                          type: string
                        index_url:
                          description: 'A URL for fetching all the records of the given record type. You can pass hashed_ids as a param with multiple values

                            to do a batch fetch for this records type.

                            '
                          type: string
                        url:
                          description: A URL that can be used to fetch this record.
                          type: string
                      required:
                      - id
                      - index_url
                      - url
                    - type: 'null'
                  cursor:
                    description: A cursor for stable pagination based on current `sort_by` order. You can pass this to `cursor[before]` or `cursor[after]` as a parameter to fetch the records before or after this record in the same sort order. This is only populated if records were fetched with `cursor[enabled]`, or `cursor[before]` or `cursor[after]`.
                    type:
                    - string
                    - 'null'
                required:
                - id
                - title
                - time_zone
                - lifecycle_status
                - registration_status
                - created_at
                - updated_at
                - audience_link
                - host_link
                - panelist_link
        '401':
          description: Unauthorized, invalid or missing token
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  code:
                    description: A machine-readable identifier for the specific authorization failure.
                    type: string
                    enum:
                    - unauthorized_credentials
                    - account_inactive
                    - unauthorized_scope
                    - unauthorized_params
                  error:
                    type: string
                    examples:
