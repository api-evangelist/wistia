  /medias/{mediaHashedId}/captions/order:
    post:
      summary: Order Captions
      description: 'This method is for ordering English captions for a video. By default, this endpoint orders computer-generated (automated) captions. Set `automated` to `false` to order human-generated captions instead.


        ## Requires api token with one of the following permissions

        ```

        Read, update & delete anything

        ```'
      parameters:
      - name: mediaHashedId
        in: path
        description: Unique identifier for the video.
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                automated:
                  description: Order computer-generated captions or paid human-generated captions. Defaults to true (computer-generated).
                  type: boolean
                  default: true
                rush:
                  description: Enable rush order for one business day turnaround or standard four business day turnaround for human-generated captions. Rush can only be used for human-generated captions.
                  type: boolean
                  default: false
                automatically_enable:
                  description: Automatically enable captions for the video once the order is ready or hold the captions for review before manually enabling.
                  type: boolean
                  default: true
      responses:
        '200':
          description: Successful operation. Captions ordered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    description: Success message indicating the captions have been purchased
                    type: string
                    examples:
                    - Captions purchased for this video. Your account will be charged when the captions are ready.
                  id:
                    description: The unique hashed identifier of the time-coded transcript that was created
                    type: string
                    examples:
                    - abc123def456
                required:
                - message
                - id
        '400':
          description: English captions already exist for this video.
        '401':
          $ref: '#/components/responses/401'
        '404':
          description: Video not found.
        '422':
          description: Unprocessable entity. Account not eligible, captions already ordered, or other validation error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    description: Error message explaining why the order cannot be completed
                    type: string
        '500':
          $ref: '#/components/responses/500'
