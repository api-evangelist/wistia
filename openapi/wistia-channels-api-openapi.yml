    post:
      summary: Create Channel
      x-wistia-mcp-annotations:
        read_only_hint: false
        read_only_hint_justification: This tool creates a new channel in the account, which modifies data.
        open_world_hint: false
        open_world_hint_justification: This tool only operates on records inside the account and does not reach external services.
        destructive_hint: false
        destructive_hint_justification: This tool only adds a new resource; existing data is not modified.
        idempotent_hint: false
        idempotent_hint_justification: Each call attempts to create an additional resource, so repeating the request may create duplicates.
      x-speakeasy-group: channels
      x-speakeasy-name-override: create
      description: Creates a channel.
      x-wistia-mcp-tool-name: create-channel
      x-wistia-mcp-description: 'Create a new Wistia Channel — a customizable, embeddable video gallery

        (also called a content hub, video showcase, series, or playlist page) that

        groups videos into episodes for viewers to browse. Use this when someone

        wants to set up, add, start, or build a new channel or video gallery. Use

        update-channel to change an existing one, get-channels to list channels, or

        create-channel-episode to add videos to a channel.

        '
      tags:
      - Channels
      requestBody:
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              type: object
              properties:
                name:
                  type:
                  - string
                  - 'null'
                  description: The display name for the channel
                description:
                  type:
                  - string
                  - 'null'
                  description: The channel's description.
                auto_publish_enabled:
                  type: boolean
                  description: Whether the episodes are automatically published when added to the channel. Cannot be enabled if podcasting is on.
                podcast_enabled:
                  type: boolean
                  description: Whether podcasting is enabled for this channel.
                custom_url:
                  type:
                  - string
                  - 'null'
                  description: Use if embedding the channel on your own site. The custom URL ensures links always direct to your page and not Wistia's.
                podcast_settings:
                  unevaluatedProperties: false
                  type: object
                  description: 'Podcast specific settings for a channel. These settings only take effect if

                    podcasting is enabled for the channel.

                    '
