openapi: 3.2.0
info:
  title: Wistia Localizations API
  version: '1.0'
  description: 'Operations tagged Localizations across 2 of this provider''s published API definitions: wistia-data-api-modern-edge-openapi.yml, wistia-data-api-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.wistia.com/modern
- url: https://api.wistia.com/v1
tags:
- name: Localizations
  x-wistia-mcp-toolsets: captions
  x-displayName: Localizations
paths:
  /medias/{mediaHashedId}/localizations:
    get:
      summary: List Localizations
      x-wistia-mcp-annotations:
        read_only_hint: true
        read_only_hint_justification: This tool only reads localizations from the account and does not modify any data.
        open_world_hint: false
        open_world_hint_justification: This tool only queries records inside the account and does not reach external services.
        destructive_hint: false
        destructive_hint_justification: This tool is read-only and does not make any changes.
        idempotent_hint: true
        idempotent_hint_justification: Reading data does not change any state, so repeated calls have no additional effect.
      x-speakeasy-group: localizations
      x-speakeasy-name-override: list
      description: 'Lists all the localizations for a media.


        ## Requires api token with one of the following permissions

        ```

        Read all data

        ```'
      x-wistia-mcp-tool-name: gets-localizations
      x-wistia-mcp-description: 'List, get, or find all localizations (translated, language-specific / dubbed

        versions) for a media, optionally including each one''s transcript. Use this

        when someone wants to see which translated or localized language variants a

        video has. Use show-localization for details on one, create-localization to

        add one, or delete-localization to remove one.

        '
      parameters:
      - name: mediaHashedId
        in: path
        description: The hashed ID of the media to list localizations for.
        required: true
        schema:
          type: string
      - name: include_transcript
        in: query
        description: Whether to include the transcript in the response.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  unevaluatedProperties: false
                  allOf:
                  - type: object
                    description: 'A localization is a translation of a media into another language.

                      '
                    properties:
                      hashed_id:
                        description: A unique alphanumeric identifier for this localization.
                        type: string
                      language_code:
                        description: A 3-character language code as specified by IETF.
                        type: string
                      iso639_2_language_code:
                        description: A 2-character language code as specified by ISO-639–2.
                        type: string
                      language_name:
                        description: The name of the language in English.
                        type: string
                      native_language_name:
                        description: The name of the language in the language of the localization.
                        type: string
                      created_at:
                        description: The date when the localization was created.
                        type: string
                        format: date-time
                      updated_at:
                        description: The date when the localization was last updated.
                        type: string
                        format: date-time
                      ordered_at:
                        description: The date when the localization was ordered.
                        type:
                        - string
                        - 'null'
                        format: date-time
                      enabled_at:
                        description: The date when the localization was enabled.
                        type:
                        - string
                        - 'null'
                        format: date-time
                      enabled:
                        description: Whether or not the localization is enabled.
                        type: boolean
                      source_media:
                        unevaluatedProperties: false
                        type: object
                        description: The media that the localization is associated with.
                        properties:
                          hashed_id:
                            description: A unique alphanumeric identifier for this media.
                            type: string
                          name:
                            description: The name of the media.
                            type: string
                          duration:
                            description: The duration of the media in seconds.
                            type: number
                          created_at:
                            description: The date when the media was created.
                            type: string
                            format: date-time
                          updated_at:
                            description: The date when the media was last updated.
                            type: string
                            format: date-time
                        required:
                        - hashed_id
                        - name
                        - duration
                        - created_at
                        - updated_at
                      transcript:
                        unevaluatedProperties: false
                        type:
                        - object
                        - 'null'
                        description: The transcript for the localization. Selectively serialized in some endpoints. See properties for endpoint.
                        properties:
                          hashed_id:
                            description: A unique alphanumeric identifier for this transcript.
                            type: string
                          language_name:
                            description: The name of the language in English.
                            type: string
                          native_language_name:
                            description: The name of the language in the language of the localization.
                            type: string
                          text:
                            description: The text of the transcript.
                            type: string
                          created_at:
                            description: The date when the transcript was created.
                            type: string
                            format: date-time
                          updated_at:
                            description: The date when the transcript was last updated.
                            type: string
                            format: date-time
                        required:
                        - hashed_id
                        - language_name
                        - native_language_name
                        - text
                        - created_at
                        - updated_at
                    required:
                    - hashed_id
                    - language_code
                    - iso639_2_language_code
                    - language_name
                    - native_language_name
                    - created_at
                    - updated_at
                    - ordered_at
                    - enabled_at
                    - enabled
                    - source_media
