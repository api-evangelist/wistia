    post:
      summary: Create Localization
      x-wistia-mcp-annotations:
        read_only_hint: false
        read_only_hint_justification: This tool creates a new localization for a media, which modifies the account.
        open_world_hint: true
        open_world_hint_justification: This tool calls an external dubbing service to produce the localized media.
        destructive_hint: true
        destructive_hint_justification: Creating a localization orders a dubbed video from a third-party service and incurs a charge. The charge cannot be undone.
        idempotent_hint: false
        idempotent_hint_justification: Each call attempts to create an additional resource, so repeating the request may create duplicates.
      x-wistia-is-purchase: true
      x-speakeasy-group: localizations
      x-speakeasy-name-override: create
      description: 'Creates a new localization.


        Creating a localization incurs a charge on your account.


        ## Requires api token with one of the following permissions

        ```

        Read, update & delete anything

        ```'
      x-wistia-mcp-tool-name: create-localization
      x-wistia-mcp-description: 'Create, add, or order a localization: a translated, language-specific

        (dubbed) version of a media in a chosen output language. This incurs a

        charge on the account (it orders a dubbed video from a third-party service)

        and is processed asynchronously. Use this when someone wants to translate or

        produce a different-language variant of a video. Use gets-localizations to

        list a media''s localizations, show-localization for one, or delete-localization

        to remove one. For subtitle tracks instead, see create-captions.

        '
      parameters:
      - name: mediaHashedId
        in: path
        description: The hashed ID of the media to create a localization for.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              type: object
              properties:
                output_language:
                  description: The language to localize the media to as a 3-character IETF language code.
                  type: string
                auto_enable:
                  description: Whether to automatically enable the localization.
                  type: boolean
                  default: true
              required:
              - output_language
      responses:
        '201':
          description: Successful creation of the localization.
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                allOf:
                - type: object
                  description: 'A localization is a translation of a media into another language.

                    '
                  properties:
                    hashed_id:
                      description: A unique alphanumeric identifier for this localization.
                      type: string
                    language_code:
                      description: A 3-character language code as specified by IETF.
                      type: string
                    iso639_2_language_code:
                      description: A 2-character language code as specified by ISO-639–2.
                      type: string
                    language_name:
                      description: The name of the language in English.
                      type: string
                    native_language_name:
                      description: The name of the language in the language of the localization.
                      type: string
                    created_at:
                      description: The date when the localization was created.
                      type: string
                      format: date-time
                    updated_at:
                      description: The date when the localization was last updated.
                      type: string
                      format: date-time
                    ordered_at:
                      description: The date when the localization was ordered.
                      type:
                      - string
                      - 'null'
                      format: date-time
                    enabled_at:
                      description: The date when the localization was enabled.
                      type:
                      - string
                      - 'null'
                      format: date-time
                    enabled:
                      description: Whether or not the localization is enabled.
                      type: boolean
                    source_media:
                      unevaluatedProperties: false
                      type: object
                      description: The media that the localization is associated with.
                      properties:
                        hashed_id:
                          description: A unique alphanumeric identifier for this media.
                          type: string
                        name:
                          description: The name of the media.
                          type: string
                        duration:
                          description: The duration of the media in seconds.
                          type: number
                        created_at:
                          description: The date when the media was created.
                          type: string
                          format: date-time
                        updated_at:
                          description: The date when the media was last updated.
                          type: string
                          format: date-time
                      required:
                      - hashed_id
                      - name
                      - duration
                      - created_at
                      - updated_at
                    transcript:
                      unevaluatedProperties: false
                      type:
                      - object
                      - 'null'
                      description: The transcript for the localization. Selectively serialized in some endpoints. See properties for endpoint.
                      properties:
                        hashed_id:
                          description: A unique alphanumeric identifier for this transcript.
                          type: string
                        language_name:
                          description: The name of the language in English.
                          type: string
                        native_language_name:
                          description: The name of the language in the language of the localization.
                          type: string
                        text:
                          description: The text of the transcript.
                          type: string
                        created_at:
                          description: The date when the transcript was created.
                          type: string
                          format: date-time
                        updated_at:
                          description: The date when the transcript was last updated.
                          type: string
                          format: date-time
                      required:
                      - hashed_id
                      - language_name
                      - native_language_name
                      - text
                      - created_at
                      - updated_at
                  required:
                  - hashed_id
                  - language_code
                  - iso639_2_language_code
                  - language_name
                  - native_language_name
                  - created_at
                  - updated_at
                  - ordered_at
                  - enabled_at
                  - enabled
                  - source_media
                - type: object
                  properties:
                    auto_enable_dubbing:
                      description: Whether or not the dubbing will be automatically enabled when completed.
                      type: boolean
                    expected_billed_minutes:
                      description: The expected number of minutes that will be billed for the dubbing.
                      type:
                      - number
                      - 'null'
                    expected_billed_price_per_minute:
                      description: The expected price per minute that will be billed for the dubbing.
                      type:
                      - number
                      - 'null'
                    expected_billed_price:
                      description: The expected total price that will be billed for the dubbing.
                      type:
                      - number
                      - 'null'
                    billed_at:
                      description: The date when the dubbing was billed.
                      type:
                      - string
                      - 'null'
                      format: date-time
                  required:
                  - auto_enable_dubbing
                  - expected_billed_minutes
                  - expected_billed_price_per_minute
                  - expected_billed_price
                  - billed_at
        '400':
          description: Bad request
