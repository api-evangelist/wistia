components:
  schemas:
    SubfolderInput:
      type: object
      description: Input data for creating or updating a subfolder.
      properties:
        name:
          description: The display name of the subfolder.
          type: string
          examples:
          - Marketing Videos
          maxLength: 255
        description:
          description: A description for the subfolder.
          type:
          - string
          - 'null'
          examples:
          - Collection of all marketing and promotional videos
          maxLength: 1000
      required:
