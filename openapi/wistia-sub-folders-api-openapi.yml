openapi: 3.2.0
info:
  title: Wistia Subfolders API
  version: '1.0'
  description: 'Operations tagged Subfolders across 2 of this provider''s published API definitions: wistia-data-api-modern-edge-openapi.yml, wistia-data-api-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.wistia.com/modern
- url: https://api.wistia.com/v1
tags:
- name: Sub Folders
  x-wistia-mcp-toolsets: folders
  x-displayName: Subfolders
paths:
  /folders/{folderId}/subfolders:
    get:
      summary: List Subfolders
      x-wistia-mcp-annotations:
        read_only_hint: true
        read_only_hint_justification: This tool only reads subfolders from the account and does not modify any data.
        open_world_hint: false
        open_world_hint_justification: This tool only queries records inside the account and does not reach external services.
        destructive_hint: false
        destructive_hint_justification: This tool is read-only and does not make any changes.
        idempotent_hint: true
        idempotent_hint_justification: Reading data does not change any state, so repeated calls have no additional effect.
      x-speakeasy-group: subfolders
      x-speakeasy-name-override: list
      description: 'Lists subfolders in a specific folder.


        ## Requires api token with one of the following permissions

        ```

        Read all folder and media data

        ```'
      x-wistia-mcp-tool-name: get-subfolders
      x-wistia-mcp-description: 'List, get, show, browse, or find subfolders within a specific folder (previously called a "project"). A subfolder is a nested folder inside a folder that organizes videos and audio files (media). Use this when someone wants to list, get, show, or browse the subfolders inside a folder. You can use the hashed_ids filter to fetch a specific subfolder, plus sorting and pagination. Use create-subfolder to add a subfolder, update-subfolder to rename one, delete-subfolder to remove one, or get-folders to list the parent folders.

        '
      parameters:
      - name: folderId
        in: path
        description: The hashed ID of the folder
        required: true
        schema:
          type: string
          examples:
          - abc123def4
      - name: page
        in: query
        description: 'The page number to retrieve. This cannot be combined with `cursor`,

          pagination.

          '
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: The number of medias per page. Use this for both offset pagination and cursor pagination.
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        description: 'If `cursor[enabled]` is set to 1 then cursor pagination is enabled and the

          first set of records are fetched up to the `per_page`. Cursor

          pagination will also be turned on if `cursor[before]` or `cursor[after]`

          are set. Records returned will have a `cursor` property set which can be used to fetch more records in the same `sort_by` ordering.

          The cursor value of the last record can be used to fetch records after the current result set and

          the cursor of the first record can be used to fetch records before the result set.


          NOTE: a cursor value is only valid if the `sort_by` value hasn''t changed from the

          last fetch. For example, you cannot fetch using `sort_by` id and then pass that

          cursor value to a `sort_by` name.

          '
        required: false
        schema:
          unevaluatedProperties: false
          type: object
          properties:
            enabled:
              description: 'If `cursor[enabled]` is set to 1, the first result set will be fetched with cursor pagination enabled. This

                values is ignored if `cursor[before]` or `cursor[after]` are set.

                '
              type: integer
              enum:
              - 0
              - 1
            before:
              description: 'If `cursor[before]` is set then cursor pagination is enabled and all records

                before the cursor up to the `per_page` are returned. This feature is useful for

                fetching "new records", for example, in a "pull to refersh" feature when showing records in a descending

                order.

                '
              type: string
            after:
              description: 'If `cursor[after]` is set then cursor pagination is enabled and all records

                after the cursor up to the `per_page` are returned.

                '
              type: string
        style: deepObject
      - name: sort_by
        in: query
        description: 'Field to sort by. When using cursor pagination (see cursor param),

          only `id` is supported.

          '
        required: false
        schema:
          type: string
          default: position
          enum:
          - name
          - created
          - updated
          - position
          - id
      - name: sort_direction
        in: query
        description: Sort direction (0 = desc, 1 = asc; default is 1)
        required: false
        schema:
          type: integer
          default: 1
          enum:
          - 0
          - 1
      - name: hashed_ids[]
        in: query
        description: Filter subfolders by their hashed IDs
        required: false
        schema:
          type: array
          items:
            type: string
        explode: true
        style: form
      responses:
        '200':
          description: A list of subfolders
          content:
            application/json:
              schema:
                type: array
                items:
                  unevaluatedProperties: false
                  allOf:
                  - type: object
                    description: A subfolder within a folder that contains media.
                    properties:
                      hashed_id:
                        description: A unique alphanumeric identifier for this subfolder.
                        type: string
                        examples:
                        - abc123def4
                      name:
                        description: The display name of the subfolder.
                        type:
                        - string
                        - 'null'
                        examples:
                        - Marketing Videos
                      description:
                        description: A description for the subfolder.
                        type:
                        - string
                        - 'null'
                        examples:
                        - Collection of all marketing and promotional videos
                      position:
                        description: The position of this subfolder within its folder, used for ordering.
                        type:
                        - integer
                        - 'null'
                        examples:
                        - 1
                      created:
                        description: The date when the subfolder was created.
                        type:
                        - string
                        - 'null'
                        format: date-time
                        examples:
                        - '2024-01-15T10:30:00+00:00'
                      updated:
                        description: The date when the subfolder was last modified.
                        type:
                        - string
                        - 'null'
                        format: date-time
                        examples:
                        - '2024-01-20T14:45:00+00:00'
                      cursor:
                        description: A cursor for stable pagination based on current `sort_by` order. You can pass this to `cursor[before]` or `cursor[after]` as a parameter to fetch the records before or after this record in the same sort order. This is only populated if records were fetched with `cursor[enabled]`, or `cursor[before]` or `cursor[after]`.
                        type:
                        - string
                        - 'null'
                    required:
                    - hashed_id
                    - position
                    - created
                    - updated
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    description: Error message detailing the reason for the bad request.
                    type: string
                    examples:
                    - Bad request
                  errors:
                    description: Array of error messages detailing the reasons for the bad request.
                    type: array
                    items:
                      type: string
        '401':
          description: Unauthorized, invalid or missing token
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  code:
                    description: A machine-readable identifier for the specific authorization failure.
                    type: string
                    enum:
                    - unauthorized_credentials
                    - account_inactive
                    - unauthorized_scope
                    - unauthorized_params
                  error:
                    type: string
                    examples:
                    - Invalid credentials.
        '404':
          description: Folder not found
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Folder with ID abc123def4 not found.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Internal server error
      tags:
      - Sub Folders
      security:
      - BearerAuth: []
      operationId: getFoldersByFolderIdSubfolders
      x-operation-id-source: derived
    post:
      summary: Create Subfolder
      x-wistia-mcp-annotations:
        read_only_hint: false
        read_only_hint_justification: This tool creates a new subfolder in the account, which modifies data.
        open_world_hint: false
        open_world_hint_justification: This tool only operates on records inside the account and does not reach external services.
        destructive_hint: false
        destructive_hint_justification: This tool only adds a new resource; existing data is not modified.
        idempotent_hint: false
        idempotent_hint_justification: Each call attempts to create an additional resource, so repeating the request may create duplicates.
      x-speakeasy-group: subfolders
      x-speakeasy-name-override: create
      description: 'Creates a new subfolder within a folder. The subfolder will be created with the next available position.


        ## Requires api token with one of the following permissions

        ```

        Read, update & delete anything

        ```'
      x-wistia-mcp-tool-name: create-subfolder
      x-wistia-mcp-description: 'Create, add, set up, or nest a new subfolder within a folder (previously called a "project"). A subfolder is a nested folder inside a folder, used to further organize videos and audio files (media). Use this when someone wants to make, add, or create a subfolder inside a folder. The subfolder is created at the next available position. To create several subfolders at once, use create-bulk-actions with resource_type "subfolder" instead of calling this repeatedly. Use update-subfolder to rename it, get-subfolders to list subfolders, delete-subfolder to remove one, or get-folders to list the parent folders.

        '
      parameters:
      - name: folderId
        in: path
        description: The hashed ID of the folder
        required: true
        schema:
          type: string
          examples:
          - abc123def4
      requestBody:
        description: Subfolder data
        required: true
        content:
          application/json:
            schema:
              type: object
              unevaluatedProperties: false
              description: Input data for creating or updating a subfolder.
              properties:
                name:
                  description: The display name of the subfolder.
                  type: string
                  examples:
                  - Marketing Videos
                  maxLength: 255
                description:
                  description: A description for the subfolder.
                  type:
                  - string
                  - 'null'
                  examples:
                  - Collection of all marketing and promotional videos
                  maxLength: 1000
              required:
              - name
            example:
              name: Marketing Videos
              description: Collection of all marketing and promotional videos
      responses:
        '201':
          description: Subfolder created successfully
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                allOf:
                - type: object
                  description: A subfolder within a folder that contains media.
                  properties:
                    hashed_id:
                      description: A unique alphanumeric identifier for this subfolder.
                      type: string
                      examples:
                      - abc123def4
                    name:
                      description: The display name of the subfolder.
                      type:
                      - string
                      - 'null'
                      examples:
                      - Marketing Videos
                    description:
                      description: A description for the subfolder.
                      type:
                      - string
                      - 'null'
                      examples:
                      - Collection of all marketing and promotional videos
                    position:
                      description: The position of this subfolder within its folder, used for ordering.
                      type:
                      - integer
                      - 'null'
                      examples:
                      - 1
                    created:
                      description: The date when the subfolder was created.
                      type:
                      - string
                      - 'null'
                      format: date-time
                      examples:
                      - '2024-01-15T10:30:00+00:00'
                    updated:
                      description: The date when the subfolder was last modified.
                      type:
                      - string
                      - 'null'
                      format: date-time
                      examples:
                      - '2024-01-20T14:45:00+00:00'
                    cursor:
                      description: A cursor for stable pagination based on current `sort_by` order. You can pass this to `cursor[before]` or `cursor[after]` as a parameter to fetch the records before or after this record in the same sort order. This is only populated if records were fetched with `cursor[enabled]`, or `cursor[before]` or `cursor[after]`.
                      type:
                      - string
                      - 'null'
                  required:
                  - hashed_id
                  - position
                  - created
                  - updated
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    description: Error message detailing the reason for the bad request.
                    type: string
                    examples:
                    - Bad request
                  errors:
                    description: Array of error messages detailing the reasons for the bad request.
                    type: array
                    items:
                      type: string
        '401':
          description: Unauthorized, invalid or missing token
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  code:
                    description: A machine-readable identifier for the specific authorization failure.
                    type: string
                    enum:
                    - unauthorized_credentials
                    - account_inactive
                    - unauthorized_scope
                    - unauthorized_params
                  error:
                    type: string
                    examples:
                    - Invalid credentials.
        '403':
          description: Forbidden, token is valid but account does not have access to feature
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Webinars are not available on your current plan
        '404':
          description: Folder not found
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Folder with ID abc123def4 not found.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Internal server error
      tags:
      - Sub Folders
      security:
      - BearerAuth: []
      operationId: postFoldersByFolderIdSubfolders
      x-operation-id-source: derived
    servers:
    - url: https://api.wistia.com/modern
  /folders/{folderId}/subfolders/{subfolderId}:
    get:
      x-wistia-mcp-ignore: true
      summary: Show Subfolder
      x-speakeasy-group: subfolders
      x-speakeasy-name-override: get
      description: 'Retrieves detailed information about a specific subfolder, including all media contained within it.


        ## Requires api token with one of the following permissions

        ```

        Read all folder and media data

        ```'
      parameters:
      - name: folderId
        in: path
        description: The hashed ID of the folder
        required: true
        schema:
          type: string
          examples:
          - abc123def4
      - name: subfolderId
        in: path
        description: The hashed ID of the subfolder
        required: true
        schema:
          type: string
          examples:
          - xyz789ghi0
      - name: description_format
        in: query
        description: Format for media descriptions
        required: false
        schema:
          type: string
          examples:
          - markdown
          const: markdown
      responses:
        '200':
          description: Subfolder details with contained media
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                description: A subfolder with its contained media files.
                allOf:
                - type: object
                  description: A subfolder within a folder that contains media.
                  properties:
                    hashed_id:
                      description: A unique alphanumeric identifier for this subfolder.
                      type: string
                      examples:
                      - abc123def4
                    name:
                      description: The display name of the subfolder.
                      type:
                      - string
                      - 'null'
                      examples:
                      - Marketing Videos
                    description:
                      description: A description for the subfolder.
                      type:
                      - string
                      - 'null'
                      examples:
                      - Collection of all marketing and promotional videos
                    position:
                      description: The position of this subfolder within its folder, used for ordering.
                      type:
                      - integer
                      - 'null'
                      examples:
                      - 1
                    created:
                      description: The date when the subfolder was created.
                      type:
                      - string
                      - 'null'
                      format: date-time
                      examples:
                      - '2024-01-15T10:30:00+00:00'
                    updated:
                      description: The date when the subfolder was last modified.
                      type:
                      - string
                      - 'null'
                      format: date-time
                      examples:
                      - '2024-01-20T14:45:00+00:00'
                    cursor:
                      description: A cursor for stable pagination based on current `sort_by` order. You can pass this to `cursor[before]` or `cursor[after]` as a parameter to fetch the records before or after this record in the same sort order. This is only populated if records were fetched with `cursor[enabled]`, or `cursor[before]` or `cursor[after]`.
                      type:
                      - string
                      - 'null'
                  required:
                  - hashed_id
                  - position
                  - created
                  - updated
                - type: object
                  properties:
                    medias:
                      description: Array of media files contained in this subfolder.
                      type: array
                      items:
                        unevaluatedProperties: false
                        allOf:
                        - type: object
                          description: 'A media generally represents a video or an audio which can be embedded into your website.


                            CDN-backed medias are accessible using this url structure: https://fast.wistia.com/embed/medias/{hashed_id}.m3u8.

                            For more information, see https://docs.wistia.com/docs/asset-urls#getting-hls-assets.

                            '
                          properties:
                            id:
                              description: A unique numeric identifier for the media within the system.
                              type: integer
                            name:
                              description: The display name of the media.
                              type: string
                            type:
                              description: A string representing what type of media this is.
                              type: string
                              enum:
                              - Video
                              - Audio
                              - Image
                              - PdfDocument
                              - MicrosoftOfficeDocument
                              - Swf
                              - UnknownType
                            archived:
                              description: Whether or not the media is archived, either true or false.
                              type: boolean
                            created:
                              description: The date when the media was originally uploaded.
                              type: string
                              format: date-time
                            updated:
                              description: The date when the media was last changed.
                              type: string
                              format: date-time
                            duration:
                              unevaluatedProperties: false
                              description: Specifies the length (in seconds) for audio and video files. Specifies number of pages in the document. Omitted for other types of media.
                              oneOf:
                              - type: number
                              - type: 'null'
                            embedCode:
                              description: 'DEPRECATED: If you want to programmatically embed videos, follow the construct an embed code guide.

                                '
                              type: string
                              deprecated: true
                            hashed_id:
                              description: A unique alphanumeric identifier for this media.
                              type: string
                            description:
                              description: A description for the media which usually appears near the top of the sidebar on the media's page.
                              type: string
                            progress:
                              description: A floating point value between 0 and 1 that indicates the progress of the processing for this file.
                              type: number
                              maximum: 1
                              minimum: 0
                            status:
                              description: 'Post upload processing status. - `queued`: the file is waiting in the queue to be processed. - `processing`: the file is actively being processed. - `ready`: the file has been fully processed and is ready for embedding and viewing. - `failed`: the file was unable to be processed (usually a format or size error).

                                '
                              type: string
                              enum:
                              - queued
                              - processing
                              - ready
                              - failed
                            section:
                              unevaluatedProperties: false
                              description: The title of the section in which the media appears. This attribute is omitted if the media is not in a section (default).
                              oneOf:
                              - type: string
                              - type: 'null'
                            thumbnail:
                              unevaluatedProperties: false
                              type: object
                              properties:
                                url:
                                  type: string
                                width:
                                  type: integer
                                height:
                                  type: integer
                            protected:
                              description: Whether the media is protected (e.g. requires a password or other authentication to view). Null if the media is not protected.
                              type:
                              - boolean
                              - 'null'
        '401':
          description: Unauthorized, invalid or missing token
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  code:
                    description: A machine-readable identifier for the specific authorization failure.
                    type: string
                    enum:
                    - unauthorized_credentials
                    - account_inactive
                    - unauthorized_scope
                    - unauthorized_params
                  error:
                    type: string
                    examples:
                    - Invalid credentials.
        '404':
          description: Folder or subfolder not found
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Subfolder with ID xyz789ghi0 not found.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Internal server error
      tags:
      - Sub Folders
      security:
      - BearerAuth: []
      operationId: getFoldersByFolderIdSubfoldersBySubfolderId
      x-operation-id-source: derived
    put:
      summary: Update Subfolder
      x-wistia-mcp-annotations:
        read_only_hint: false
        read_only_hint_justification: This tool modifies an existing subfolder in the account.
        open_world_hint: false
        open_world_hint_justification: This tool only operates on records inside the account and does not reach external services.
        destructive_hint: true
        destructive_hint_justification: Updating replaces existing values and the previous data cannot be recovered.
        idempotent_hint: true
        idempotent_hint_justification: Re-sending the same update with identical attributes leaves the resource in the same state, so repeating the request has no additional effect.
      x-speakeasy-group: subfolders
      x-speakeasy-name-override: update
      description: 'Updates a subfolder''s name and/or description.


        ## Requires api token with one of the following permissions

        ```

        Read, update & delete anything

        ```'
      x-wistia-mcp-tool-name: update-subfolder
      x-wistia-mcp-description: 'Update, edit, change, or rename a subfolder''s name and/or description. A subfolder is a nested folder inside a folder (previously called a "project") that organizes videos and audio files (media). Use this when someone wants to update, edit, change, or rename a subfolder. Use create-subfolder to add a new subfolder, get-subfolders to list subfolders, delete-subfolder to remove one, or update-folder to edit the parent folder.

        '
      parameters:
      - name: folderId
        in: path
        description: The hashed ID of the folder
        required: true
        schema:
          type: string
          examples:
          - abc123def4
      - name: subfolderId
        in: path
        description: The hashed ID of the subfolder
        required: true
        schema:
          type: string
          examples:
          - xyz789ghi0
      requestBody:
        description: Updated subfolder data
        required: true
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              type: object
              properties:
                name:
                  description: The new name for the subfolder
                  type: string
                  examples:
                  - Updated Marketing Videos
                  maxLength: 255
                description:
                  description: The new description for the subfolder
                  type:
                  - string
                  - 'null'
                  examples:
                  - Updated collection of marketing materials
                  maxLength: 1000
            example:
              name: Updated Marketing Videos
              description: Updated collection of marketing materials
      responses:
        '200':
          description: Subfolder updated successfully
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                allOf:
                - type: object
                  description: A subfolder within a folder that contains media.
                  properties:
                    hashed_id:
                      description: A unique alphanumeric identifier for this subfolder.
                      type: string
                      examples:
                      - abc123def4
                    name:
                      description: The display name of the subfolder.
                      type:
                      - string
                      - 'null'
                      examples:
                      - Marketing Videos
                    description:
                      description: A description for the subfolder.
                      type:
                      - string
                      - 'null'
                      examples:
                      - Collection of all marketing and promotional videos
                    position:
                      description: The position of this subfolder within its folder, used for ordering.
                      type:
                      - integer
                      - 'null'
                      examples:
                      - 1
                    created:
                      description: The date when the subfolder was created.
                      type:
                      - string
                      - 'null'
                      format: date-time
                      examples:
                      - '2024-01-15T10:30:00+00:00'
                    updated:
                      description: The date when the subfolder was last modified.
                      type:
                      - string
                      - 'null'
                      format: date-time
                      examples:
                      - '2024-01-20T14:45:00+00:00'
                    cursor:
                      description: A cursor for stable pagination based on current `sort_by` order. You can pass this to `cursor[before]` or `cursor[after]` as a parameter to fetch the records before or after this record in the same sort order. This is only populated if records were fetched with `cursor[enabled]`, or `cursor[before]` or `cursor[after]`.
                      type:
                      - string
                      - 'null'
                  required:
                  - hashed_id
                  - position
                  - created
                  - updated
        '401':
          description: Unauthorized, invalid or missing token
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  code:
                    description: A machine-readable identifier for the specific authorization failure.
                    type: string
                    enum:
                    - unauthorized_credentials
                    - account_inactive
                    - unauthorized_scope
                    - unauthorized_params
                  error:
                    type: string
                    examples:
                    - Invalid credentials.
        '404':
          description: Folder or subfolder not found
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Subfolder with ID xyz789ghi0 not found.
