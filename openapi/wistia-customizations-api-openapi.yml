                  qualityControl:
                    type: string
                  playbackRateControl:
                    type: string
                  smallPlayButton:
                    type: string
                  spherical:
                    type: string
                  volumeControl:
                    type: string
                  copyLinkAndThumbnailEnabled:
                    type: string
                  doNotTrack:
                    type: string
                  email:
                    type: string
                  fitStrategy:
                    type: string
                  fullscreenOnRotateToLandscape:
                    type: string
                  muted:
                    type: string
                  playlistLinks:
                    type: string
                  playlistLoop:
                    type: string
                  playsinline:
                    type: string
                  playPauseNotifier:
                    type: string
                  playSuspendedOffScreen:
                    type: string
                  preload:
                    type: string
                  qualityMax:
                    type: string
                  qualityMin:
                    type: string
                  resumable:
                    type: string
                  seo:
                    type: string
                  silentAutoPlay:
                    type: string
                  time:
                    type: string
                  thumbnailAltText:
                    type: string
                  videoFoam:
                    type: string
                  volume:
                    type: string
                  wmode:
                    type: string
                  keyMoments:
                    description: String representation of whether the key moments feature is enabled.
                    type: string
                  plugin:
                    unevaluatedProperties: true
                    description: 'Container for player plugin configurations. Plugin keys are extensible and

                      not strictly validated; the documented sub-objects represent the most

                      common plugins.

                      '
                    type: object
                    properties:
                      passwordProtectedVideo:
                        unevaluatedProperties: false
                        type: object
                        properties:
                          'on':
                            type: string
                          src:
                            type: string
                          challenge:
                            type: string
                          async:
