    put:
      x-wistia-mcp-ignore: true
      summary: Update Customizations
      x-speakeasy-group: customizations
      x-speakeasy-name-override: update
      description: 'Allows for partial updates on a video’s customizations. If a value is null, then that key will be deleted from the saved customizations. If it is not null, that value will be set.


        ## Requires api token with one of the following permissions

        ```

        Read, update & delete anything

        ```'
      x-wistia-mcp-tool-name: update-customizations
      x-wistia-mcp-description: 'Allows for partial updates on a video’s customizations. If a value is null, then that key will be deleted from the saved customizations. If it is not null, that value will be set.

        '
      parameters:
      - name: mediaId
        in: path
        description: The hashed ID of the video to be customized.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              type: object
              description: 'A collection of settings you can apply to a video to change its appearance and

                behavior.

                '
              properties:
                autoPlay:
                  description: If set to true, the video will play as soon as it’s ready. Note that autoplay might not work on some devices and browsers.
                  type: boolean
