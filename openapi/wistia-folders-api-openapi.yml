    put:
      summary: Update Folder
      x-wistia-mcp-annotations:
        read_only_hint: false
        read_only_hint_justification: This tool modifies an existing folder in the account.
        open_world_hint: false
        open_world_hint_justification: This tool only operates on records inside the account and does not reach external services.
        destructive_hint: true
        destructive_hint_justification: Updating replaces existing values and the previous data cannot be recovered.
        idempotent_hint: true
        idempotent_hint_justification: Re-sending the same update with identical attributes leaves the resource in the same state, so repeating the request has no additional effect.
      x-speakeasy-group: folders
      x-speakeasy-name-override: update
      description: 'Updates a folder (previously called project)


        ## Requires api token with one of the following permissions

        ```

        Read, update & delete anything

        ```'
      x-wistia-mcp-tool-name: update-folder
      x-wistia-mcp-description: 'Update, edit, change, or rename an existing folder (previously called a "project") — a container that organizes videos and audio files (media). Use this when someone wants to update, edit, change, or rename a folder or project. Use create-folder to make a new folder, get-folders to list folders, delete-folder to remove one, copy-folder to duplicate one, or update-subfolder to edit a nested subfolder.

        '
      parameters:
      - name: id
        in: path
        description: Folder Hashed ID
        required: true
        schema:
          description: Hashed ID of the folder (e.g., "4d23503f70")
          type: string
      requestBody:
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              type: object
              properties:
                name:
                  description: The folder’s new name.
                  type: string
                  examples:
                  - My New Folder Name
                description:
                  description: The folder’s new description.
                  type: string
                  examples:
                  - My New Folder Description
                anonymousCanUpload:
                  description: Whether anonymous users can upload media to the folder.
                  type: boolean
                anonymousCanDownload:
                  description: Whether anonymous users can download media from the folder.
                  type: boolean
                public:
                  description: A flag indicating whether or not the folder is enabled for public access.
                  type: boolean
                  examples:
                  - false
      responses:
        '200':
          description: A single folder
