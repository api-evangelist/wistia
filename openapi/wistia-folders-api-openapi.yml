  /folders/{id}/copy:
    post:
      summary: Copy Folder
      x-wistia-mcp-annotations:
        read_only_hint: false
        read_only_hint_justification: This tool creates a new folder copy, which modifies the account.
        open_world_hint: false
        open_world_hint_justification: This tool only operates on records inside the account and does not reach external services.
        destructive_hint: false
        destructive_hint_justification: Copying only adds a new folder; existing folders are not modified.
        idempotent_hint: false
        idempotent_hint_justification: Each call creates an additional copy of the folder and its contents.
      x-speakeasy-group: folders
      x-speakeasy-name-override: copy
      description: 'This copies a folder (previously called project) and all its media and subfolders asynchronously in a background job.


        This method does not copy the folder’s sharing information (i.e. users that could see the old folder will not automatically be able to see the new one).


        For the request you can specify the owner of a new folder by passing an optional parameter. The person you specify must be a Manager in the account.


        The body of the response will contain an object representing the background job that was created.


        ## Requires api token with one of the following permissions

        ```

        Read, update & delete anything

        ```'
      x-wistia-mcp-tool-name: copy-folder
      x-wistia-mcp-description: 'Copy, duplicate, or clone a folder (previously called a "project") along with all its media and subfolders. Use this when someone wants to copy, duplicate, or clone an existing folder or project and its contents. The copy runs asynchronously in a background job, so the response contains an object representing the queued background job. Sharing information is NOT copied (users who could see the old folder will not automatically see the new one). You may pass an optional parameter to set the owner of the new folder, but the person specified must be a Manager in the account. Use create-folder to make an empty folder, update-folder to rename, get-folders to list folders, or create-folder-sharing to grant access to the copy.

        '
      parameters:
      - name: id
        in: path
        description: Folder Hashed ID
        required: true
        schema:
          description: Hashed ID of the folder (e.g., "4d23503f70")
          type: string
      requestBody:
