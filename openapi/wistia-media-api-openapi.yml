        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Folder with ID 'fakeid' not found.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Internal server error
      tags:
      - Media
      security:
      - BearerAuth: []
      operationId: getMediasByMediaHashedId
      x-operation-id-source: derived
    put:
      summary: Update Media
      x-wistia-mcp-annotations:
        read_only_hint: false
        read_only_hint_justification: This tool modifies an existing media in the account.
        open_world_hint: false
        open_world_hint_justification: This tool only operates on records inside the account and does not reach external services.
        destructive_hint: true
        destructive_hint_justification: Updating replaces existing values and the previous data cannot be recovered.
        idempotent_hint: true
        idempotent_hint_justification: Re-sending the same update with identical attributes leaves the resource in the same state, so repeating the request has no additional effect.
      x-speakeasy-group: media
      x-speakeasy-name-override: update
      description: 'Updates the attributes on a media.


        ## Requires api token with one of the following permissions

        ```

        Read, update & delete anything

        ```'
      x-wistia-mcp-tool-name: update-media
      x-wistia-mcp-description: 'Update, edit, change, or rename the attributes of a media (a video or audio file) by

        hashed_id. Use this when someone wants to change a video or audio file''s name,

        description, complete tag list, or thumbnail/still image. Supplying tags replaces all

        existing tags. Do not use this to add tags to a media while keeping its current tags;

        use bulk-tag-media instead. This edits metadata only — to replace the underlying file use swap-media,

        and to relocate it use move-media.

        '
      parameters:
      - name: mediaHashedId
        in: path
        description: The hashed ID of the media.
        required: true
        schema:
          description: Hashed ID of the media (e.g., "4d23503f70")
          type: string
      requestBody:
