  /medias/import_url:
    post:
      summary: Import Media from URL
      x-wistia-mcp-annotations:
        read_only_hint: false
        read_only_hint_justification: This tool imports a new media from a URL, which adds data to the account.
        open_world_hint: true
        open_world_hint_justification: This tool fetches content from a publicly accessible URL outside of Wistia's servers.
        destructive_hint: false
        destructive_hint_justification: Importing only adds a new media; existing data is not modified or removed.
        idempotent_hint: false
        idempotent_hint_justification: Each call imports the file again, creating an additional media.
      x-speakeasy-group: media
      x-speakeasy-name-override: importUrl
      x-cli-action-override: import
      x-wistia-mcp-tool-name: import-media-from-url
      x-wistia-mcp-description: 'Import or upload a media (a video or audio file) into the account from a publicly

        accessible URL. Use this when someone wants to import, upload, ingest, or add a video

        or audio file from a remote link. The import runs asynchronously in the background and

        returns a background_job_status to poll for progress rather than a Media object. The URL

        must be publicly fetchable by Wistia''s servers; some domains (e.g. vimeo.com, wistia.com)

        are not permitted. If no folder_id is given, a new "Untitled Folder" is created to hold

        the imported media.

        '
      description: 'This endpoint imports a media file from a given URL. The import is processed

        asynchronously and will return a background_job_status object rather than the

        typical Media response object. You can poll the background job status endpoint

        to check on the progress of the import.


        If no folder_id is provided, a new folder called "Untitled Folder" will be

        created and the imported media will be placed there.


        The URL must be publicly accessible — Wistia''s servers need to be able to fetch the file directly.


        Note: imports from certain domains (e.g. vimeo.com, wistia.com) are not permitted.


        <!--- HIDE-MCP -->

        ## Requires api token with one of the following permissions

        ```

        Read, update & delete anything

        ```

        <!--- /HIDE-MCP -->

        '
      requestBody:
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              type: object
              properties:
                url:
                  description: The publicly accessible URL of the media file to import.
                  type: string
                  format: uri
                  examples:
                  - https://example.com/video.mp4
                folder_id:
                  description: The hashed ID of the folder (project) to import the media into. If not provided, a new folder will be created.
                  type: string
              required:
              - url
      responses:
        '201':
          description: Successfully queued background job for URL import.
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                allOf:
                - type: object
                  properties:
                    message:
                      description: A confirmation message that the background job has been queued.
                      type: string
                    background_job_status:
                      unevaluatedProperties: false
                      allOf:
                      - type: object
                        description: 'A background job keeps track of the progress of an asynchronous task, e.g

                          bulk archiving media, translating media, etc.

                          '
                        properties:
                          id:
                            description: The ID of the background job that's been queued for the request.
                            type: integer
                          hashed_id:
                            description: The unguessable hashed ID of the background job. Prefer this over the numeric ID when polling for status.
                            type: string
                          status:
                            description: The status of the background job that's been queued for the request.
                            type: string
                            enum:
                            - queued
                            - started
                            - finished
                            - failed
                        required:
                        - id
                        - hashed_id
                        - status
                  required:
                  - message
                  - background_job_status
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
