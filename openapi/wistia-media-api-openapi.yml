    put:
      summary: Update Media
      description: 'Updates the attributes on a media.


        <!--- HIDE-MCP -->

        ## Requires api token with one of the following permissions

        ```

        Read, update & delete anything

        ```

        <!--- /HIDE-MCP -->

        '
      parameters:
      - name: mediaHashedId
        in: path
        description: The hashed ID of the media.
        required: true
        schema:
          description: Hashed ID of the media (e.g., "4d23503f70")
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              type: object
              properties:
                name:
                  description: The media’s new name.
                  type: string
                new_still_media_id:
                  description: 'The Wistia hashed ID of an image that will replace the still that’s displayed before the player starts playing.

                    '
                  type: string
                description:
                  description: A new description for this media. Accepts plain text or markdown.
                  type: string
                tags:
                  description: An array of tag names to apply to the media. Note that this will replace any existing tags!
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                allOf:
                - type: object
                  description: 'A media generally represents a video or an audio which can be embedded into your website.


