                        examples:
                        - My Folder
                    required:
                    - id
                    - name
                  cursor:
                    description: A cursor for stable pagination based on current `sort_by` order. You can pass this to `cursor[before]` or `cursor[after]` as a parameter to fetch the records before or after this record in the same sort order. This is only populated if records were fetched with `cursor[enabled]`, or `cursor[before]` or `cursor[after]`.
                    type:
                    - string
                    - 'null'
                required:
                - id
                - is_admin
                - can_share
                - can_download
                - can_upload
                - share
                - folder
        '401':
          description: Unauthorized, invalid or missing token
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  code:
                    description: A machine-readable identifier for the specific authorization failure.
                    type: string
                    enum:
                    - unauthorized_credentials
                    - account_inactive
                    - unauthorized_scope
                    - unauthorized_params
                  error:
                    type: string
                    examples:
                    - Invalid credentials.
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Folder with ID 'fakeid' not found.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Internal server error
      tags:
      - Folder Sharings
      security:
      - BearerAuth: []
      operationId: getFoldersByFolderIdSharingsBySharingId
      x-operation-id-source: derived
    put:
      summary: Update Folder Sharing
      x-wistia-mcp-annotations:
        read_only_hint: false
        read_only_hint_justification: This tool modifies an existing folder sharing in the account.
        open_world_hint: false
        open_world_hint_justification: This tool only operates on records inside the account and does not reach external services.
        destructive_hint: true
        destructive_hint_justification: Updating replaces existing values and the previous data cannot be recovered.
        idempotent_hint: true
        idempotent_hint_justification: Re-sending the same update with identical attributes leaves the resource in the same state, so repeating the request has no additional effect.
      x-speakeasy-group: folderSharings
      x-speakeasy-name-override: update
      description: 'Updates a sharing on a folder.


        ## Requires api token with one of the following permissions

        ```

        Read, update & delete anything

        ```'
      x-wistia-mcp-tool-name: update-folder-sharing
      x-wistia-mcp-description: 'Update, edit, or change a folder sharing — modify a contact''s or contact group''s access/permission on a folder (previously called a "project"). Use this when someone wants to change, edit, or update an existing folder sharing or access permission. Use create-folder-sharing to grant new access, get-folder-sharings to list current sharings, or delete-folder-sharing to revoke access.

        '
      parameters:
      - name: folderId
        in: path
        description: ID of the folder
        required: true
        schema:
          type: string
      - name: sharingId
        in: path
        description: ID of the sharing to be updated
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              unevaluatedProperties: false
              type: object
              properties:
                sharing:
                  unevaluatedProperties: false
                  type: object
                  properties:
                    canShare:
                      description: Allow the user or group to share the folder with others.
                      type: boolean
                    canDownload:
                      description: Allow the user or group to download media from the folder.
                      type: boolean
                    canUpload:
                      description: Allow the user or group to upload media to the folder.
                      type: boolean
                    isAdmin:
                      description: Give this user admin rights to the folder.
                      type: boolean
      responses:
        '200':
          description: Sharing updated successfully
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                description: 'A sharing is an object that links either a contact or a contact group to a folder, including information about the contacts'' permissions to that folder.

                  '
                properties:
                  id:
                    type: integer
                    examples:
                    - 14
                  is_admin:
                    type: boolean
                    examples:
                    - true
                  can_share:
                    type: boolean
                    examples:
                    - true
                  can_download:
                    type: boolean
                    examples:
                    - true
                  can_upload:
                    type: boolean
                    examples:
                    - true
                  share:
                    unevaluatedProperties: false
                    type: object
                    properties:
                      id:
                        type: integer
                        examples:
                        - 3
                      name:
                        type: string
                        examples:
                        - Jim
                      type:
                        type: string
                        examples:
                        - Contact
                      email:
                        type: string
                        format: email
                        examples:
                        - jim@wistia.com
                    required:
                    - id
                    - name
                    - type
                    - email
                  folder:
                    unevaluatedProperties: false
                    type: object
                    properties:
                      id:
                        type: integer
                        examples:
                        - 13
                      name:
                        type: string
                        examples:
                        - My Folder
                    required:
                    - id
                    - name
                  cursor:
                    description: A cursor for stable pagination based on current `sort_by` order. You can pass this to `cursor[before]` or `cursor[after]` as a parameter to fetch the records before or after this record in the same sort order. This is only populated if records were fetched with `cursor[enabled]`, or `cursor[before]` or `cursor[after]`.
                    type:
                    - string
                    - 'null'
                required:
                - id
                - is_admin
                - can_share
                - can_download
                - can_upload
                - share
                - folder
        '401':
          description: Unauthorized, invalid or missing token
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  code:
                    description: A machine-readable identifier for the specific authorization failure.
                    type: string
                    enum:
                    - unauthorized_credentials
                    - account_inactive
                    - unauthorized_scope
                    - unauthorized_params
                  error:
                    type: string
                    examples:
                    - Invalid credentials.
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Folder with ID 'fakeid' not found.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                properties:
                  error:
                    type: string
                    examples:
                    - Internal server error
      tags:
      - Folder Sharings
      security:
      - BearerAuth: []
      operationId: putFoldersByFolderIdSharingsBySharingId
      x-operation-id-source: derived
    delete:
      summary: Delete Folder Sharing
      x-wistia-mcp-annotations:
        read_only_hint: false
        read_only_hint_justification: This tool deletes a folder sharing from the account, which modifies data.
        open_world_hint: false
        open_world_hint_justification: This tool only operates on records inside the account and does not reach external services.
        destructive_hint: true
        destructive_hint_justification: This tool permanently deletes the folder sharing and cannot be undone.
        idempotent_hint: true
        idempotent_hint_justification: Deleting a resource that is already deleted has no additional effect, so the request can be safely repeated.
      x-speakeasy-group: folderSharings
      x-speakeasy-name-override: delete
      description: 'Deletes a sharing on a folder.


        ## Requires api token with one of the following permissions

        ```

        Read, update & delete anything

        ```'
      x-wistia-mcp-tool-name: delete-folder-sharing
      x-wistia-mcp-description: 'Delete a folder sharing — remove or revoke a contact''s or contact group''s access to a folder (previously called a "project"). Use this when someone wants to unshare a folder, revoke access, or remove a person or group''s permission on a folder. Use get-folder-sharings to list current sharings, create-folder-sharing to grant access, or update-folder-sharing to change a sharing instead of removing it.

        '
      parameters:
      - name: folderId
        in: path
        description: Hashed ID of the folder
        required: true
        schema:
          description: Hashed ID of the folder (e.g., "4d23503f70")
          type: string
      - name: sharingId
        in: path
        description: ID of the sharing to be deleted
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Sharing deleted successfully
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                description: 'A sharing is an object that links either a contact or a contact group to a folder, including information about the contacts'' permissions to that folder.

                  '
                properties:
                  id:
                    type: integer
                    examples:
                    - 14
                  is_admin:
                    type: boolean
                    examples:
                    - true
                  can_share:
                    type: boolean
                    examples:
                    - true
                  can_download:
                    type: boolean
                    examples:
                    - true
                  can_upload:
                    type: boolean
                    examples:
                    - true
                  share:
                    unevaluatedProperties: false
                    type: object
                    properties:
                      id:
                        type: integer
                        examples:
                        - 3
                      name:
                        type: string
                        examples:
                        - Jim
                      type:
                        type: string
                        examples:
                        - Contact
                      email:
                        type: string
                        format: email
                        examples:
                        - jim@wistia.com
