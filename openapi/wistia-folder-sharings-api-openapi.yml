          type: string
      - name: sharingId
        in: path
        description: The ID of the specific sharing object that you want to see.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successfully retrieved sharing details
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                type: object
                description: 'A sharing is an object that links either a contact or a contact group to a folder, including information about the contacts'' permissions to that folder.

                  '
                properties:
                  id:
                    type: integer
                    examples:
                    - 14
                  is_admin:
                    type: boolean
                    examples:
                    - true
                  can_share:
                    type: boolean
                    examples:
                    - true
                  can_download:
                    type: boolean
                    examples:
