                      - type: string
                        description: Default is "0". Set to "1" to allow the user to share the folder with others.
                        enum:
                        - '0'
                        - '1'
                      - type: boolean
                        description: Whether the user is allowed to share the folder with others.
                        examples:
                        - false
                    canDownload:
                      unevaluatedProperties: false
                      x-wistia-mcp-type: boolean
                      oneOf:
                      - type: string
                        description: Default is "0". Set to "1" to allow the user to download files from the folder.
