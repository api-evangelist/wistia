                        description: Default is "1". Set to "0" to allow access without a password.
                        enum:
                        - '0'
                        - '1'
                      - type: boolean
                        description: A flag indicating whether or not a password is required.
                        examples:
                        - false
                    canShare:
                      unevaluatedProperties: false
