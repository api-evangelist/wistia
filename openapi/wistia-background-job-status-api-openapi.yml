  title: Wistia Background Job Status API
  version: '1.0'
  description: 'Operations tagged Background Job Status across 3 of this provider''s published API definitions: wistia-data-api-2026-01-openapi.yml, wistia-data-api-modern-edge-openapi.yml, wistia-data-api-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
