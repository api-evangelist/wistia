gaps:
- >-
  No error `type` URI, no per-error documentation link, and no error-code reference page in the
  docs — outside the 401 `code` enum, every error must be matched on English prose.
- >-
  The 429 body is text/plain while every other error is JSON, so a single parse path fails exactly
  when a client is being throttled.
- >-
  20 declared error responses carry no content schema at all, so the contract does not say what the
  client will receive.
