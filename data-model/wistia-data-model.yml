notes:
- Derived from the STABLE 2026-01 cut (54 schemas). The edge description carries 155 schemas and adds
  Remix, Brands, Share Links, Review Bundles, Custom Metadata Fields and Deleted Media — see openapi/wistia-data-api-modern-edge-openapi.yml.
- The v1 track models the same domain with `project` where 2026-01 says `folder`, and in camelCase. Same
  graph, different names — see lifecycle/wistia-lifecycle.yml.
- 'The Stats API kept the pre-rename noun: /stats/projects/{projectId} was deliberately NOT renamed to
  folders in 2026-01.'
- 'MediaProperties.embedCode is marked deprecated: true in the spec, pointing callers at the construct-an-embed-code
  guide instead.'
