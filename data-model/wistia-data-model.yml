source: openapi/wistia-data-api-2026-01-openapi.yml — path nesting, the Includes* mixin schemas, and *_id
  / *_hashed_id reference fields across components.schemas
description: 'Entity-relationship graph of the Wistia Data API 2026-01 stable release. The spine is Folder
  -> Subfolder -> Media, with Media as the hub: captions, localizations, customizations, trims, taggings
  and stats all hang off a single media. Channels and Webinars are parallel containers that also reference
  media. A note on how this was derived: Wistia''s spec does NOT link entities with $ref in properties
  — related objects are inlined, and the shared ones are factored into mixin schemas named Includes* (IncludesFolder,
  IncludesSubfolder, IncludesTags, IncludesAssets). So the reliable relationship signal here is URL nesting
  plus those mixins, not the $ref graph, and a naive $ref crawl of this spec returns almost nothing.'
identifier_scheme:
  primary: hashed_id
  secondary: id
  note: Media, channels, channel episodes and localizations are addressed in URLs by an opaque `hashed_id`
    string; folders, subfolders, webinars and background jobs are addressed by a numeric `id`. Objects
    typically expose BOTH, so passing the wrong one is a silent 404. The 2026-01 release renamed v1's
    camelCase `hashedId` to `hashed_id`.
  prefixes: null
  prefix_note: Wistia ids carry no type prefix — a hashed id is not self-describing.
