  url: https://fast.wistia.com/player.js
  language: JavaScript
  official: true
  version: null
  published: null
  note: >-
    The default in-app embed code loads https://fast.wistia.com/player.js with NO version
    suffix, which Wistia's own docs say always follows the newest release — so a consumer
    cannot tell which player build they are running. Version pinning IS supported via an
    `@<version>` suffix (player.js@1.2.3) on both fast.wistia.com and fast.wistia.net, but
