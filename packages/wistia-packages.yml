description: >-
  First-party Wistia client libraries, the CLI binary, and the embeddable player
  distributions, with the latest published version and release date read from each
  registry's own metadata endpoint. Wistia's official SDK surface is small and recent:
  a Speakeasy-generated TypeScript API client, the Aurora player web component (plus
  its React wrapper), and a Go CLI shipped through Homebrew and GitHub Releases. There
  is no first-party Python, Ruby, PHP, Java, .NET or Go SDK for the Data API — the Ruby
  gems on RubyGems are long-abandoned community work.
